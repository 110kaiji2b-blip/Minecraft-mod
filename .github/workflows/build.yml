name: Build Forge 1.20.1 Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod JAR
        run: ./gradlew build --no-daemon

      - name: Upload Built Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: swiftskyblock-1.20.1-jar
          path: build/libs/swiftskyblock-*.jar
